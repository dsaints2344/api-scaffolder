name: payments
on:
  push:
    paths: ["services/payments/**", "Directory.*.props", "global.json"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet test Platform.slnx
